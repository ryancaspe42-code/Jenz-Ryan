<!DOCTYPE html>
<html>
<head>
<title>Neon Tic-Tac-Toe</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:linear-gradient(135deg,#09001f,#001d35);
  color:white;
}

.game{
  text-align:center;
  padding:30px;
  border-radius:25px;
  background:rgba(255,255,255,.08);
  box-shadow:0 0 40px #00eaff;
  backdrop-filter:blur(10px);
}

h1{
  font-size:45px;
  margin:5px;
  color:#00eaff;
  text-shadow:0 0 20px #00eaff;
}

#status{
  margin:15px;
  font-size:20px;
}

.board{
  display:grid;
  grid-template-columns:repeat(3,100px);
  gap:10px;
}

.cell{
  width:100px;
  height:100px;
  border:2px solid #00eaff;
  border-radius:15px;
  background:rgba(0,0,0,.35);
  color:white;
  font-size:55px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.cell:hover{
  transform:scale(1.07);
  box-shadow:0 0 20px #00eaff;
}

button.restart{
  margin-top:20px;
  padding:12px 25px;
  border:0;
  border-radius:20px;
  background:#00eaff;
  color:#00101a;
  font-weight:bold;
  cursor:pointer;
}

.score{
  display:flex;
  justify-content:space-around;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="game">

<h1>⚡ TIC-TAC-TOE</h1>

<div class="score">
  <span>❌ X: <b id="xScore">0</b></span>
  <span>⭕ O: <b id="oScore">0</b></span>
</div>

<div id="status">Player X's Turn</div>

<div class="board">
  <button class="cell" onclick="play(0)"></button>
  <button class="cell" onclick="play(1)"></button>
  <button class="cell" onclick="play(2)"></button>
  <button class="cell" onclick="play(3)"></button>
  <button class="cell" onclick="play(4)"></button>
  <button class="cell" onclick="play(5)"></button>
  <button class="cell" onclick="play(6)"></button>
  <button class="cell" onclick="play(7)"></button>
  <button class="cell" onclick="play(8)"></button>
</div>

<button class="restart" onclick="resetGame()">🔄 RESTART</button>

</div>

<script>
let board=["","","","","","","","",""];
let player="X";
let gameOver=false;
let xScore=0;
let oScore=0;

const cells=document.querySelectorAll(".cell");

function play(i){
  if(board[i] || gameOver)return;

  board[i]=player;
  cells[i].textContent=player;

  if(checkWin()){
    document.getElementById("status").textContent=
      "🎉 Player "+player+" Wins!";

    if(player==="X"){
      xScore++;
      document.getElementById("xScore").textContent=xScore;
    }else{
      oScore++;
      document.getElementById("oScore").textContent=oScore;
    }

    gameOver=true;
    return;
  }

  if(!board.includes("")){
    document.getElementById("status").textContent="🤝 DRAW!";
    gameOver=true;
    return;
  }

  player=player==="X"?"O":"X";

  document.getElementById("status").textContent=
    "Player "+player+"'s Turn";
}

function checkWin(){
  let wins=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return wins.some(w=>
    board[w[0]] &&
    board[w[0]]===board[w[1]] &&
    board[w[1]]===board[w[2]]
  );
}

function resetGame(){
  board=["","","","","","","","",""];
  player="X";
  gameOver=false;

  cells.forEach(c=>c.textContent="");

  document.getElementById("status").textContent=
    "Player X's Turn";
}
</script>

</body>
  </html>
